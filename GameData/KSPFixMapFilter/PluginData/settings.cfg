// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Keeps the filter buttons of the map view's vessel filter panel from taking clicks while the panel is
// folded. Folded, the panel sits just above the screen, but the lower edge of its buttons, transparent,
// still reaches a few pixels into it: on stock, a click at the very top of the screen toggles a filter
// instead of opening the panel.
foldedFiltersIgnoreClicks = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line every time the
// filter buttons start or stop ignoring clicks.
logLevel = Info
